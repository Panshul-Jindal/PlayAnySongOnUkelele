[project]
name = "playanysongonukelele"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.1",
    "autochord>=0.1.4",
    "beautifulsoup4>=4.15.0",
    "demucs>=4.0.1",
    "faster-whisper>=1.2.1",
    "gradio>=6.32.0",
    "librosa>=1.0.0",
    "lv-chordia",
    "mir-eval>=0.8.2",
    "requests>=2.34.2",
    "setuptools<81",
    "tf-keras>=2.21.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv.sources]
# LV-Chordia is installed from source (upstream stopped publishing to PyPI
# after 1.1.0), pinned to one commit; its wheel carries the model weights.
lv-chordia = { git = "https://github.com/openmirlab/lv-chordia", rev = "d8ab9ac99bce081bb79065d717f96e2c3b2099c8" }
# CPU-only torch: far smaller than the default CUDA build.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our scripts are not packages, so tests import them from their folders.
pythonpath = ["beat-tracking", "chord-estimation", "chord-evaluation", "common", "difficulty", "play-along", "preprocessing", "simplification", "tab-alignment", "transformations", "."]
addopts = ["--import-mode=importlib"]
