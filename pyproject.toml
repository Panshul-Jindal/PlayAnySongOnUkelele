[project]
name = "playanysongonukelele"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "autochord>=0.1.4",
    "librosa>=1.0.0",
    "setuptools<81",
    "tf-keras>=2.21.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Our scripts are not packages, so tests import them from their folders.
pythonpath = ["beat-tracking", "common", "difficulty", "play-along", "preprocessing", "transformations", "."]
addopts = ["--import-mode=importlib"]
