<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can&#x27;t Help Falling in Love (simplified) · play along</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #75736c; --line: #dedbd2; --panel: #f1efe9;
  --accent: #2f6f5e; --on-accent: #ffffff; --warn-bg: #fff1cc; --warn-fg: #634700;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --fg: #ecebe7; --muted: #9b988f; --line: #3a3934; --panel: #22221f;
    --accent: #6cc3a5; --on-accent: #10201b; --warn-bg: #3d3216; --warn-fg: #f3d68a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px;
         padding: 14px 24px; border-bottom: 1px solid var(--line); }
h1 { margin: 0; font-size: 20px; font-weight: 600; }
.load { cursor: pointer; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel); }
.load input { display: none; }
#messages p { margin: 10px 24px 0; padding: 8px 12px; border-radius: 8px; }
#messages .info { padding-left: 0; color: var(--muted); }
#messages .warn { background: var(--warn-bg); color: var(--warn-fg); }
main, #list { padding: 20px 24px 110px; }
.chords { display: grid; grid-template-columns: 3fr 2fr; gap: 32px; align-items: start; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#pulse { display: inline-block; width: 18px; height: 18px; margin-left: 10px; border-radius: 50%;
         background: var(--accent); opacity: 0; vertical-align: middle; }
#tempo { margin-left: 8px; text-transform: none; }
#now { font-size: clamp(64px, 11vw, 150px); font-weight: 700; line-height: 1.05; white-space: nowrap; }
#sounding { min-height: 1.4em; color: var(--muted); }
#next { font-size: clamp(36px, 5.5vw, 80px); font-weight: 600; line-height: 1.05; white-space: nowrap; }
.shape { min-height: 24px; margin-top: 12px; }
.shape svg { display: block; width: 104px; height: auto; }
.shape.big svg { width: 156px; }
.shape .string, .shape .fret { stroke: var(--fg); stroke-width: 1.2; }
.shape .nut { stroke: var(--fg); stroke-width: 4; }
.shape .dot, .shape .barre { fill: var(--fg); }
.shape text.finger { fill: var(--bg); font-weight: 700; }
.shape .open { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.shape text { fill: var(--muted); font: 11px system-ui, sans-serif; text-anchor: middle; }
.shape text.pos { text-anchor: start; }
.noshape { margin: 0; color: var(--muted); }
#shapenote { margin: 14px 0 0; }
.bar { height: 10px; margin-top: 14px; border-radius: 5px; background: var(--line); overflow: hidden; }
#fill { width: 0; height: 100%; background: var(--accent); }
#lyrics { min-height: 7em; margin: 36px 0 28px; }
#lyrics pre { margin: 0; white-space: pre; overflow-x: auto;
              font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#chordline { min-height: 1.3em; color: var(--accent); font-weight: 700; font-size: clamp(18px, 2.4vw, 30px); }
#lyricline { min-height: 1.3em; font-size: clamp(18px, 2.4vw, 30px); }
#nextline { margin-top: 8px; color: var(--muted); font-size: clamp(14px, 1.8vw, 22px); }
.tapping #chordline { color: var(--muted); font-weight: 400; }
#upcoming { display: flex; gap: 4px; }
.chip { min-width: 48px; padding: 8px 6px; border-radius: 6px; background: var(--panel);
        text-align: center; font-weight: 600; white-space: nowrap; overflow: hidden; }
.chip.current { background: var(--accent); color: var(--on-accent); }
#chordlist { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
footer { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center;
         gap: 12px; padding: 12px 24px; border-top: 1px solid var(--line); background: var(--panel); }
footer label, .keys { color: var(--muted); }
button, select { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px;
                 background: var(--bg); color: var(--fg); font: inherit; }
button:disabled { opacity: .5; }
#play { min-width: 52px; }
#seek { flex: 1; min-width: 160px; accent-color: var(--accent); }
#time { font-variant-numeric: tabular-nums; }
</style>
</head>

</footer>

<script>
"use strict";

// ---- pure functions: no page state, so they also run outside a browser ----

function indexAt(starts, t) {
  // the index of the last start at or before t, or -1 if t comes before them all
  let lo = 0, hi = starts.length - 1, found = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (starts[mid] <= t) { found = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return found;
}

function clock(t) {
  // 65.34 -> "1:05.3"
  const tenths = Math.round(t * 10), m = Math.floor(tenths / 600), s = (tenths - 600 * m) / 10;
  return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
}

const CHORD_TOKEN = /^[A-G][#b]?(m|maj|min|dim|aug|sus|add|M)?\d*(\(?[#b]?\d+\)?)*(sus\d)?(\/[A-G][#b]?)?$/;

function lyricLines(text) {
  // the sung lines of a lyrics file; skips blank lines, labels such as
  // "[Chorus]", "Bridge:" or "Source: www.example.com", and lines made only of
  // chord names, so lyrics can be pasted from a tab site as they are
  return text.split(/\r?\n/).map(l => l.trim()).filter(l => {
    if (l === "" || /^\[.*\]$/.test(l)) return false;
    const words = l.split(/\s+/);
    const label = words.length <= 3 && (words[0].endsWith(":") || words[words.length - 1].endsWith(":"));
    return !label && !words.every(w => CHORD_TOKEN.test(w));
  });
}

function chordLine(text, s, e, segs, starts, capo, beat) {

  // at s, then each change above the point of the line it falls on in time,
  // moved to the start of a word; names never overlap. The chord sounding at s
  // is left out when it started before s and the next one comes within `beat`
  // seconds: it is the last line's chord still ringing, and the line starts
  // with its first change
  let out = "";
  const put = (pos, name) => {
    pos = Math.max(pos, out.length ? out.length + 1 : 0);
    out += " ".repeat(pos - out.length) + name;
  };
  let i = Math.max(0, indexAt(starts, s));
  if (beat > 0 && starts[i] < s && i + 1 < segs.length && starts[i + 1] < e && starts[i + 1] - s < beat) i++;
  put(0, segs[i].names[capo]);
  for (i++; i < segs.length && starts[i] < e; i++) {
    let pos = e > s ? Math.round((starts[i] - s) / (e - s) * text.length) : 0;
    if (text[pos] === " ") while (pos < text.length && text[pos] === " ") pos++;
    else while (pos > 0 && text[pos - 1] !== " ") pos--;
    put(pos, segs[i].names[capo]);
  }
  return out;
}

function beatAt(beats, t) {
  // one beat in seconds around time t: the median gap between the beats within
  // 5 s of t, so it follows a song that speeds up or slows down; 0.5 s with
  // fewer than three beats there (common/beats.py beat_at)
  const near = beats.filter(b => Math.abs(b - t) <= 5);
  if (near.length < 3) return 0.5;
  const gaps = near.slice(1).map((b, k) => b - near[k]).sort((a, b) => a - b);
  const m = gaps.length >> 1;
  return gaps.length % 2 ? gaps[m] : (gaps[m - 1] + gaps[m]) / 2;
}

function pulse(beats, t) {
  // how brightly the beat pulse shows at time t: 1 on a beat, fading to 0
  // halfway to the next one, and 0 before the first beat
  const i = indexAt(beats, t);
  if (i < 0) return 0;
  const gap = i + 1 < beats.length ? beats[i + 1] - beats[i] : (i > 0 ? beats[i] - beats[i - 1] : 0);
  return gap > 0 ? Math.max(0, 1 - 2 * (t - beats[i]) / gap) : 0;
}

function tapView(lyrics, tapped) {
  // what tap mode shows after `tapped` taps, laid out as when playing along:
  // the line being sung (the last one tapped) and the line the next tap starts
  return [tapped ? lyrics[tapped - 1] : "…", lyrics[tapped] || ""];
}

function diagram(frets, fingers) {
  // an SVG chord diagram: strings G C E A from left to right; a dot on each
  // pressed fret, with its finger (1 index ... 4 little) when fingers are known;
  // one bar where a finger presses several strings; an open circle above each
  // open string; the frets written underneath; four frets, starting further up
  // the neck when the shape needs it
  const pressed = frets.filter(f => f > 0);
  const high = pressed.length ? Math.max(...pressed) : 0;
  const first = high > 4 ? Math.min(...pressed) : 1;   // the fret in the top row
  const rows = Math.max(4, high - first + 1);
  const x = i => 16 + 20 * i, y = r => 34 + 20 * r;    // string i; the line above row r
  const centre = f => y(f - first) + 10;
  const label = "frets " + frets.join(" ") + (fingers ? ", fingers " + fingers.join(" ") : "");
  const out = [`<svg viewBox="0 0 ${x(3) + 30} ${y(rows) + 22}" role="img" aria-label="${label}">`];
  ["G", "C", "E", "A"].forEach((s, i) => out.push(`<text x="${x(i)}" y="10">${s}</text>`));
  for (let r = 0; r <= rows; r++) {
    const kind = r === 0 && first === 1 ? "nut" : "fret";
    out.push(`<line class="${kind}" x1="${x(0)}" y1="${y(r)}" x2="${x(3)}" y2="${y(r)}"/>`);
  }
  for (let i = 0; i < 4; i++) out.push(`<line class="string" x1="${x(i)}" y1="${y(0)}" x2="${x(i)}" y2="${y(rows)}"/>`);
  if (first > 1) out.push(`<text class="pos" x="${x(3) + 10}" y="${y(0) + 14}">${first}</text>`);
  const strings = {};   // finger -> the strings it presses
  if (fingers) fingers.forEach((g, i) => { if (g > 0) (strings[g] = strings[g] || []).push(i); });
  for (const g in strings) {
    if (strings[g].length < 2) continue;   // a barre
    const a = Math.min(...strings[g]), b = Math.max(...strings[g]), cy = centre(frets[a]);
    out.push(`<rect class="barre" x="${x(a) - 6.5}" y="${cy - 6.5}" width="${x(b) - x(a) + 13}" height="13" rx="6.5"/>`);
    out.push(`<text class="finger" x="${(x(a) + x(b)) / 2}" y="${cy + 4}">${g}</text>`);
  }
  frets.forEach((f, i) => {
    if (f === 0) {
      out.push(`<circle class="open" cx="${x(i)}" cy="24" r="4.5"/>`);
    } else if (!fingers || strings[fingers[i]].length < 2) {
      out.push(`<circle class="dot" cx="${x(i)}" cy="${centre(f)}" r="6.5"/>`);
      if (fingers) out.push(`<text class="finger" x="${x(i)}" y="${centre(f) + 4}">${fingers[i]}</text>`);
    }
  });
  frets.forEach((f, i) => out.push(`<text x="${x(i)}" y="${y(rows) + 16}">${f}</text>`));
  out.push("</svg>");
  return out.join("");
}

function linesLab(starts, end) {
  // tapped line starts as a .lab file: each line ends where the next begins
  return starts.map((t, i) => t.toFixed(3) + "\t" +
    (i + 1 < starts.length ? starts[i + 1] : end).toFixed(3) + "\tline " + (i + 1)).join("\n") + "\n";
}

// ---- the page ----

const DATA = JSON.parse(document.getElementById("song-data").textContent);
const SEGS = DATA.segments;
const STARTS = SEGS.map(s => s.start);
const BEATS = DATA.beats || [];
const STORE = "play-along:" + DATA.source + ":lines";
const TAPPED = "tapped in this browser";
const $ = id => document.getElementById(id);
const audio = new Audio();
audio.preservesPitch = true;  // slowing down must not change the key

let capo = DATA.capo || 0, audioName = "", lyrics = null, lineStarts = null, lineSource = "";
let tapping = false, taps = [], seeking = false;
let clicks = null, lastBeat = -1;   // the click's audio context, once switched on
const shown = {seg: -1, capo: -1, line: -2};
const notes = {};

function click() {
  // a short tick, to hear whether the tracked beats land on the music's beat
  // a square wave, louder and brighter than a sine at the same level
  const tone = clicks.createOscillator(), level = clicks.createGain();
  tone.type = "square";
  tone.frequency.value = 1500;
  level.gain.setValueAtTime(0.8, clicks.currentTime);
  level.gain.exponentialRampToValueAtTime(0.001, clicks.currentTime + 0.05);
  tone.connect(level).connect(clicks.destination);
  tone.start();
  tone.stop(clicks.currentTime + 0.05);
}

function say(key, kind, text) {
  notes[key] = {kind, text};
  const box = $("messages");
  box.textContent = "";
  for (const k in notes) {
    const p = document.createElement("p");
    p.className = notes[k].kind;
    p.textContent = notes[k].text;
    box.appendChild(p);
  }
}

function loadLineTimes() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(STORE)); } catch (e) { stored = null; }
  if (Array.isArray(stored) && stored.length) { lineStarts = stored; lineSource = TAPPED; }
  else if (DATA.lines) { lineStarts = DATA.lines.map(l => l.start); lineSource = "embedded in this page"; }
  $("download").hidden = lineSource !== TAPPED;
}

function checkLyrics() {
  if (!lyrics) return;
  if (!lineStarts) {
    say("lyrics", "info", "Lyrics: " + lyrics.length + " lines. Press “Tap lines” to time them.");
  } else if (lineStarts.length !== lyrics.length) {
    say("lyrics", "warn", "The lyrics file has " + lyrics.length + " lines but there are " +
        lineStarts.length + " line times (" + lineSource + "), so no lyrics are shown. " +
        "Tap the lines again, or fix the file.");
  } else {
    say("lyrics", "info", "Lyrics: " + lyrics.length + " lines, times " + lineSource + ".");
  }
}

function updateButtons() {
  const ready = audio.readyState > 0;
  $("play").disabled = !ready;
  $("seek").disabled = !ready || tapping;
  $("tap").disabled = !ready || !lyrics;
  $("tap").textContent = tapping ? "Stop tapping" : "Tap lines";
}

function loadFiles(files) {
  for (const f of files) {
    if (/\.txt$/i.test(f.name)) {
      f.text().then(text => {
        lyrics = lyricLines(text);
        shown.line = -2;
        checkLyrics();
        updateButtons();
      });
    } else if (f.type.startsWith("audio/") || /\.(wav|mp3|m4a|flac|ogg|aac)$/i.test(f.name)) {
      audioName = f.name;
      audio.src = URL.createObjectURL(f);
    }
  }
}

function togglePlay() {
  if (audio.paused) audio.play(); else audio.pause();
}

function startTapping() {
  tapping = true;
  taps = [];
  document.body.classList.add("tapping");
  audio.pause();
  audio.currentTime = 0;
  say("tap", "info", "Tap mode: press Space to start the song, then Space each time a new line starts. " +
      "Backspace undoes the last tap; Esc stops.");
  updateButtons();
}

function tap() {
  if (audio.paused) { audio.play(); return; }  // starting or resuming the song is not a tap
  const t = audio.currentTime;
  if (taps.length && t <= taps[taps.length - 1]) return;
  taps.push(t);
  if (taps.length === lyrics.length) stopTapping();
}

function stopTapping() {
  tapping = false;
  document.body.classList.remove("tapping");
  if (taps.length === lyrics.length) {
    try { localStorage.setItem(STORE, JSON.stringify(taps)); } catch (e) { /* kept for this visit only */ }
    lineStarts = taps.slice();
    lineSource = TAPPED;
    $("download").hidden = false;
    say("tap", "info", "All " + taps.length + " lines tapped. Download lines.lab and save it in the song's folder.");
  } else {
    say("tap", "warn", "Stopped after " + taps.length + " of " + lyrics.length + " lines; nothing was saved.");
  }
  shown.line = -2;
  checkLyrics();
  updateButtons();
}

function renderShape(box, seg) {
  const shape = seg ? seg.shapes[capo] : null;
  if (!seg || seg.label === "N" || seg.label === "X") box.innerHTML = "";
  else if (!shape) box.innerHTML = '<p class="noshape">no 4-string shape</p>';
  else box.innerHTML = diagram(shape.frets, shape.fingers) +
    (shape.chosen && !shape.chart ? '<p class="noshape">not the chart\'s first shape: chosen as easier here</p>'
     : shape.chart ? "" : '<p class="noshape">provisional shape</p>');
}

function renderUpcoming(i) {
  const box = $("upcoming");
  box.textContent = "";
  for (let k = i; k < Math.min(SEGS.length, i + 9); k++) {
    const chip = document.createElement("div");
    chip.className = k === i ? "chip current" : "chip";
    chip.style.flexGrow = SEGS[k].end - SEGS[k].start;
    chip.textContent = SEGS[k].names[capo];
    box.appendChild(chip);
  }
}

function renderLyrics(t, changed) {
  const chord = $("chordline"), line = $("lyricline"), next = $("nextline");
  if (tapping) {
    chord.textContent = audio.paused ? "press Space to play" :
      taps.length + " of " + lyrics.length + " lines tapped · Space when the next line starts";
    [line.textContent, next.textContent] = tapView(lyrics, taps.length);
    return;
  }
  if (!lyrics || !lineStarts || lineStarts.length !== lyrics.length) {
    chord.textContent = line.textContent = next.textContent = "";
    return;
  }
  const j = indexAt(lineStarts, t);
  if (j === shown.line && !changed) return;
  shown.line = j;
  if (j < 0) {
    chord.textContent = "";
    line.textContent = "…";
    next.textContent = lyrics[0];
    return;
  }
  const end = j + 1 < lineStarts.length ? lineStarts[j + 1] : (audio.duration || DATA.duration);
  chord.textContent = chordLine(lyrics[j], lineStarts[j], end, SEGS, STARTS, capo, beatAt(BEATS, lineStarts[j]));
  line.textContent = lyrics[j];
  next.textContent = lyrics[j + 1] || "";
}

function render(force) {
  const t = audio.currentTime || 0;
  const i = Math.max(0, indexAt(STARTS, t));
  const seg = SEGS[i];
  if (force || i !== shown.seg || capo !== shown.capo) {
    $("now").textContent = seg.names[capo];
    $("sounding").textContent = capo ? "sounds as " + seg.names[0] : "";
    $("next").textContent = i + 1 < SEGS.length ? SEGS[i + 1].names[capo] : "end";
    renderShape($("nowshape"), seg);
    renderShape($("nextshape"), SEGS[i + 1]);
    $("shapenote").textContent = "fingers: 1 index · 2 middle · 3 ring · 4 little" +
      (capo ? " · frets counted from the capo" : "");
    renderUpcoming(i);
  }
  const progress = Math.min(1, Math.max(0, (t - seg.start) / (seg.end - seg.start)));
  $("fill").style.width = (100 * progress) + "%";
  renderLyrics(t, force || capo !== shown.capo);
  shown.seg = i;
  shown.capo = capo;
  $("time").textContent = clock(t) + " / " + clock(audio.duration || DATA.duration);
  if (!seeking) $("seek").value = t;
  if (BEATS.length) {
    $("pulse").style.opacity = pulse(BEATS, t);
    // the tempo around now: it changes when the song speeds up or slows down
    const bpm = Math.round(60 / beatAt(BEATS, t));
    if (bpm !== shown.bpm) $("tempo").textContent = bpm + " BPM";
    shown.bpm = bpm;
    const b = indexAt(BEATS, t);
    // tick only when playback reaches the next beat, not when seeking past several
    if (clicks && $("click").checked && !audio.paused && b === lastBeat + 1) click();
    lastBeat = b;
  }
}

audio.addEventListener("loadedmetadata", () => {
  $("player").hidden = false;
  $("list").hidden = true;
  $("seek").max = audio.duration;
  if (Math.abs(audio.duration - DATA.duration) > 1) {
    say("audio", "warn", "This audio is " + audio.duration.toFixed(1) + " s long, but the chords end at " +
        DATA.duration.toFixed(1) + " s: it may not be the file they were made from.");
  } else {
    say("audio", "info", "Audio: " + audioName);
  }
  updateButtons();
  render(true);
});
audio.addEventListener("play", () => { $("play").textContent = "❚❚"; });
audio.addEventListener("pause", () => { $("play").textContent = "▶"; });
audio.addEventListener("ended", () => { if (tapping) stopTapping(); });

$("chordlist").textContent = SEGS.map(s =>
  clock(s.start) + "  " + s.names[0].padEnd(6) + " for " + (s.end - s.start).toFixed(1) + " s").join("\n");
for (let c = 0; c < 12; c++) $("capo").add(new Option(c ? "fret " + c : "none", c));
$("capo").value = capo;

$("files").addEventListener("change", e => loadFiles(e.target.files));
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); loadFiles(e.dataTransfer.files); });
// buttons and menus give focus back, so Space always reaches the shortcuts below
$("play").addEventListener("click", e => { togglePlay(); e.currentTarget.blur(); });
$("tap").addEventListener("click", e => { if (tapping) stopTapping(); else startTapping(); e.currentTarget.blur(); });
$("download").addEventListener("click", e => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([linesLab(lineStarts, audio.duration || DATA.duration)], {type: "text/plain"}));
  a.download = "lines.lab";
  document.body.appendChild(a);
  a.click();
  a.remove();
  e.currentTarget.blur();
});
$("capo").addEventListener("change", e => { capo = Number(e.target.value); e.target.blur(); });
$("speed").addEventListener("change", e => { audio.playbackRate = Number(e.target.value); e.target.blur(); });
if (BEATS.length) {
  $("pulse").hidden = false;
  $("clicklabel").hidden = false;
  $("tempo").textContent = DATA.tempo + " BPM";
}
// the song's volume, so the click can be heard over it
$("volume").addEventListener("input", e => { audio.volume = Number(e.target.value); });
$("volume").addEventListener("change", e => e.target.blur());
$("click").addEventListener("change", e => {
  // browsers allow sound only after a click, so the audio context is made here
  if (e.target.checked && !clicks) clicks = new AudioContext();
  if (clicks) clicks.resume();
  e.target.blur();
});
$("seek").addEventListener("input", e => { seeking = true; audio.currentTime = Number(e.target.value); });
$("seek").addEventListener("change", e => { seeking = false; e.target.blur(); });
document.addEventListener("keydown", e => {
  if (audio.readyState === 0 || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === "Space") { e.preventDefault(); if (tapping) tap(); else togglePlay(); }
  else if (tapping && e.code === "Backspace") { e.preventDefault(); taps.pop(); }
  else if (tapping && e.code === "Escape") { audio.pause(); stopTapping(); }
  else if (!tapping && e.code === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
  else if (!tapping && e.code === "ArrowRight") audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
});

loadLineTimes();
(function frame() { render(false); requestAnimationFrame(frame); })();
</script>
</body>
</html>
